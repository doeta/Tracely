[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracely"
version = "0.1.0"
description = "Desktop application for IEEE XES process mining and event-log intelligence using PM4Py and PySide6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pm4py>=2.7.0",
    "pandas>=2.0.0",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
